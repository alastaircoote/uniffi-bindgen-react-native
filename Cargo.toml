 [workspace]
members = [
    "crates/*",
    "examples/*",
    "fixtures/*",
    "runtimes/*",
    "runtimes/napi/fixtures/*",
    "xtask",
]

resolver = "2"

[workspace.dependencies]
anyhow = "1"
askama = "0.13.1"
camino = "1.1.6"
cargo_metadata = "0.23.1"
clap = { version = "4.5.4", features = ["derive"] }
extend = "1.2.0"
heck = "0.5.0"
paste = "1.0.14"
pathdiff = { version = "0.2.1", features = ["camino"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
uniffi = "=0.31.1"
uniffi_bindgen = "=0.31.1"
uniffi_core = { version = "=0.31.1", default-features = false }
uniffi_meta = "=0.31.1"
ubrn_fixture_testing = { path = "crates/ubrn_fixture_testing" }
ubrn_macros = { path = "crates/ubrn_macros" }

[patch.crates-io]
  uniffi          = { git = "https://github.com/mozilla/uniffi-rs", rev = "7e0e8fd3" }
  uniffi_bindgen  = { git = "https://github.com/mozilla/uniffi-rs", rev = "7e0e8fd3" }
  uniffi_meta     = { git = "https://github.com/mozilla/uniffi-rs", rev = "7e0e8fd3" }
  uniffi_core     = { git = "https://github.com/mozilla/uniffi-rs", rev = "7e0e8fd3" }
  uniffi_macros   = { git = "https://github.com/mozilla/uniffi-rs", rev = "7e0e8fd3" }